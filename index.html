            margin-bottom: 16px;
            font-family: 'Georgia', serif;
            letter-spacing: -1px;

            align-items: center;
            gap: 24px;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            flex-wrap: wrap;
        }

        .meta-item {

            align-items: center;
            gap: 8px;
        }

            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;

        .badge-hot { background: #dc2626; color: white; }
        .badge-very-hot { background: #7f1d1d; color: white; }
        .badge-vegan { background: #bbf7d0; color: #065f46; }

            margin-bottom: 40px;
        }

            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 16px;
            padding: 16px;
            background: white;
            border-radius: 8px;

            border-left: 4px solid #64748b;

            font-size: 24px;
            font-weight: 700;
            color: #0f172a;

        }

            height: 24px;

        }

        }

            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .section-content.collapsed {
            max-height: 0;
        }

        .ingredients-list {
            display: grid;
            gap: 0;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            padding-left: 16px;

        }

        .ingredient-amount {

            color: #0f172a;

            flex-direction: column;
            gap: 12px;
        }

        .step-item {
            display: flex;
            gap: 16px;
        }

            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1e293b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;

            color: #475569;
            padding-top: 4px;

            font-weight: 700;

            letter-spacing: 1px;
            color: #cbd5e1;
            margin-bottom: 4px;

            font-size: 14px;
            color: #94a3b8;
        }

            display: flex;
            flex-direction: column;
            gap: 8px;

            text-align: left;
            background: transparent;
            border: none;
            color: inherit;
            font-family: inherit;

                padding: 16px;

                grid-column: 1 / -1;
                padding: 12px;

                grid-column: 1 / -1;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 8px;
                padding: 0;
            }

            .main-content {
                padding: 24px;
            }

            .recipe-title {
                font-size: 32px;
            }

</head>

        function getSpiceBadgeClass(spice) {
            const spiceMap = {
                'mild': 'badge-mild',
                'medium': 'badge-medium',
                'hot': 'badge-hot',
                'very-hot': 'badge-very-hot'
            };
            return spiceMap[spice] || 'badge-mild';
        }

        function renderRecipe(recipe) {
            const ingredientsExpanded = true;
            const stepsExpanded = true;

            return `
                <div class="recipe-header">
                    <h1 class="recipe-title">${recipe.title}</h1>
                    <div class="recipe-meta">
                        <div class="meta-item">
                            👥 <span>${recipe.servings} servings</span>
                        </div>
                        <div class="meta-item">
                            ⏱️ <span>${recipe.time} min</span>
                        </div>
                        <div class="badge ${getSpiceBadgeClass(recipe.spice)}">${recipe.spice}</div>
                        ${recipe.vegan ? `<div class="badge badge-vegan">Vegan</div>` : ''}
                    </div>
                </div>

                <div class="section">
                    <button class="section-header" onclick="toggleSection(this)">
                        <h2>Ingredients</h2>
                        <svg class="chevron ${ingredientsExpanded ? '' : 'rotated'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                        </svg>
                    </button>
                    <div class="section-content ${ingredientsExpanded ? '' : 'collapsed'}">
                        <div class="ingredients-list">
                            ${recipe.ingredients.map((ing, idx) => `
                                <div class="ingredient-item">
                                    <span class="ingredient-name">${ing.name}</span>
                                    <span class="ingredient-amount">${ing.amount}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <div class="section">
                    <button class="section-header" onclick="toggleSection(this)">
                        <h2>Instructions</h2>
                        <svg class="chevron ${stepsExpanded ? '' : 'rotated'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                        </svg>
                    </button>
                    <div class="section-content ${stepsExpanded ? '' : 'collapsed'}">
                        <ol class="steps-list">
                            ${recipe.steps.map((step, idx) => `
                                <li class="step-item">
                                    <span class="step-number">${idx + 1}</span>
                                    <span class="step-text">${step}</span>
                                </li>
                            `).join('')}
                        </ol>
                    </div>
                </div>
            `;
        }

        function toggleSection(button) {
            const chevron = button.querySelector('.chevron');
            const content = button.nextElementSibling;
            chevron.classList.toggle('rotated');
            content.classList.toggle('collapsed');
        }

        function initializeApp() {
            const mainContent = document.getElementById('mainContent');
            const recipesList = document.getElementById('recipesList');

            // Render first recipe
            mainContent.innerHTML = renderRecipe(recipes[0]);

            // Render recipe buttons
            recipesList.innerHTML = recipes.map(recipe => `
                <button class="recipe-item ${recipe.id === 1 ? 'active' : ''}" onclick="selectRecipe(${recipe.id})">
                    <div class="recipe-item-title">${recipe.title}</div>
                    <div class="recipe-item-cuisine">${recipe.cuisine}</div>
                </button>
            `).join('');
        }

        function selectRecipe(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            document.getElementById('mainContent').innerHTML = renderRecipe(recipe);

            // Update active button
            document.querySelectorAll('.recipe-item').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.recipe-item').classList.add('active');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
